name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' siquis-recesso.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "SIQUIS_RECESSO_VERSION'" siquis-recesso.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$CONST" ] && [ "$TAG" = "$STABLE" ] || { echo "Version mismatch"; exit 1; }

      - name: Build package
        run: git archive --format=zip --prefix=siquis-recesso/ -o package.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" package.zip --title "$GITHUB_REF_NAME" --notes "$GITHUB_REF_NAME"
